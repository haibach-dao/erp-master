name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter @erp/api db:generate

      - name: Lint
        run: pnpm -r lint

      - name: Format check
        run: pnpm format:check

      - name: Build (also type-checks)
        run: pnpm -r build

      - name: Test
        run: pnpm -r test

  # Việc CSDL — job RIÊNG, chạy song song với `build`.
  #
  # KHÔNG nhét vào `build`: job kia không cần Postgres, và bắt nó chờ một container lên là làm
  # chậm phản hồi cho mọi PR chỉ đụng giao diện.
  #
  # ĐỌC KỸ TRƯỚC KHI THÊM BƯỚC VÀO ĐÂY. Job này CỐ Ý KHÔNG so "danh mục mã quyền trong mã nguồn"
  # với "bảng authz.permissions" sau khi seed. Phép so ấy KHÔNG THỂ ĐỎ: `prisma/seed.ts` import
  # thẳng `PERMISSION_CATALOG` rồi upsert từng dòng, nên trên một CSDL vừa seed thì bảng là ẢNH
  # của danh mục với mọi nội dung danh mục. Một dấu xanh mang tên "quyền khớp CSDL" mà cấu trúc
  # không cho phép nó đỏ thì tệ hơn không có: hôm 03/09/2026 nó đã xanh, và nó sẽ làm việc chẩn
  # đoán chậm đi. Việc đối chiếu CSDL THẬT là của `check:permissions` chạy sau khi triển khai và
  # của người gác lúc API khởi động; việc ép mã mới phải kèm migration là của ratchet
  # `permission-catalog-invariants` chạy ở job `build`.
  #
  # Bốn thứ dưới đây thì ĐỎ ĐƯỢC THẬT, và hôm nay không có gì canh chúng.
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine # khớp docker-compose.yml
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://erp:erp@127.0.0.1:5432/erp?schema=public
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter @erp/api db:generate

      # 1. Toàn bộ migration áp được TỪ SỐ KHÔNG. Máy ai cũng có sẵn một CSDL đã chạy dở, nên
      #    một migration hỏng chỉ lộ ra ở lần dựng máy mới — tức là muộn nhất có thể.
      - name: Migrations áp được từ số không
        run: pnpm --filter @erp/api db:migrate

      # Bước so ngay dưới dựng lại cả chuỗi migration vào một CSDL BÓNG rồi mới so, và nó KHÔNG
      # tự tạo CSDL đó — thiếu bước này thì chết với `P1003 Database erp_shadow does not exist`.
      # Lúc đo ở local tôi tạo tay nên không thấy thiếu; lần chạy thật đầu tiên trên CI mới lộ ra.
      - name: Tạo CSDL bóng cho bước so sánh
        run: PGPASSWORD=erp psql -h 127.0.0.1 -U erp -d postgres -c 'CREATE DATABASE erp_shadow'

      # 2. `schema.prisma` KHỚP với chuỗi migration. Lệch ở đây nghĩa là Prisma Client sinh ra
      #    một kiểu mà CSDL không có — mã biên dịch xanh rồi vỡ lúc chạy.
      #    ĐÃ ĐO 03/09/2026 trước khi biến thành bước chặn: "No difference detected", exit 0.
      #    Lo ngại ban đầu là partial unique index và CHECK (có trong migration, không diễn tả
      #    được trong schema.prisma) sẽ gây đỏ giả — KHÔNG: `migrate diff` không nhìn thấy chúng
      #    ở cả hai phía nên chúng triệt tiêu nhau.
      - name: schema.prisma khớp với migrations
        run: >-
          pnpm --filter @erp/api exec prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url postgresql://erp:erp@127.0.0.1:5432/erp_shadow
          --exit-code

      # 3. Seed CHẠY ĐƯỢC. Hôm nay seed không được biên dịch, không được lint, không được test và
      #    không được chạy ở bất kỳ đâu trong CI — nó chỉ chạy trên máy người ta, lúc đã muộn.
      - name: Seed chạy được
        run: pnpm --filter @erp/api db:seed

      # 4. Các ràng buộc CHECK và partial unique index THẬT SỰ chặn. Chúng nằm trong SQL thuần nên
      #    không một test vitest nào chạm tới được; mock Prisma không dựng lại được ràng buộc.
      #    Mỗi phép thử nằm trong giao dịch riêng và ROLLBACK, nên không để lại gì.
      - name: Ràng buộc CSDL thật sự chặn
        run: pnpm --filter @erp/api exec tsx scripts/db-constraint-smoke.ts
