packages:
  - apps/*
  - packages/*
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  # SWC không cần build script: nhị phân theo nền tảng đến từ optionalDependencies
  # (@swc/core-win32-x64-msvc / -linux-x64-gnu). Đã kiểm: metadata decorator vẫn sinh
  # đúng khi build script bị chặn.
  '@swc/core': false
  esbuild: true
  msgpackr-extract: false
  prisma: true
  sharp: true
  unrs-resolver: true
